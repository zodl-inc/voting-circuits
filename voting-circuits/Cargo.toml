[package]
name = "voting-circuits"
version = "0.4.2"
edition = "2021"
description = "Governance ZKP circuits (delegation, vote proof, share reveal) for the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[dependencies]
orchard = { version = "0.14", features = ["circuit", "unstable-voting-circuits"] }
halo2_proofs = { version = "0.3", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
halo2_gadgets = { version = "0.5", default-features = false }
pasta_curves = "0.5"
ff = { version = "0.13", default-features = false }
group = "0.13"
rand = { version = "0.8", default-features = false }
blake2b_simd = "1"
poseidon = { package = "halo2_poseidon", version = "0.1" }
incrementalmerkletree = "0.8.1"
lazy_static = "1"
sinsemilla = "0.1"

[dev-dependencies]
imt-tree = "0.1"
criterion = "0.8"
rand = "0.8"
incrementalmerkletree = "0.8.1"

[features]
default = []
share-reveal = []
mock-prover-checks = []

[lib]
bench = false

[[bench]]
name = "delegation"
harness = false

[patch.crates-io]
halo2_gadgets = { package = "halo2_gadgets", git = "https://github.com/zodl-inc/halo2-security-fixes.git", rev = "d751768afe0d2105b349dd93f73fde7f2eade088" }
halo2_proofs = { package = "halo2_proofs", git = "https://github.com/zodl-inc/halo2-security-fixes.git", rev = "d751768afe0d2105b349dd93f73fde7f2eade088" }
poseidon = { package = "halo2_poseidon", git = "https://github.com/zodl-inc/halo2-security-fixes.git", rev = "d751768afe0d2105b349dd93f73fde7f2eade088" }
orchard = { git = "https://github.com/zodl-inc/orchard-security-fixes.git", rev = "994dad2f7bb8c85e7c8ea336dcc2a814a94bc9fd" }
imt-tree = { git = "https://github.com/zodl-inc/vote-nullifier-pir-security-fixes.git", rev = "f8c57997a078fe44f68a65969e34e1c3caab5851" }
